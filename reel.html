<!DOCTYPE html>
<html>
<head>
    <title>Globeface Reel</title>
    <script type="text/javascript">
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const reelId = urlParams.get('reelId');

            // 1. अगर रील आईडी है, तो ऐप की कस्टम स्कीम चलाने की कोशिश करो
            if (reelId) {
                window.location.href = "globeface://reel?reelId=" + reelId;
            }

            // 2. एंड्रॉइड के लिए एक स्पेशल 'Intent Link' जो ब्राउज़र को बंद करके सीधा असली Google Play Store ऐप खोलता है
            setTimeout(function() {
                window.location.href = "intent://details?id=com.ags.globeface#Intent;scheme=market;package=com.android.vending;end";
            }, 1200);
        };
    </script>
</head>
<body style="background-color: #121212; color: #ffffff; text-align: center; font-family: Arial, sans-serif; padding-top: 100px;">
    <h2>Globeface App Open Ho Raha Hai...</h2>
    <p>We are opening the app or redirecting you directly to the Play Store app.</p>
</body>
</html>
