<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Globeface Reel</title>

    <script>
        window.onload = function () {

            const params = new URLSearchParams(window.location.search);
            const reelId = params.get("reelId");

            if (!reelId) {
                document.getElementById("status").innerText =
                    "Reel ID नहीं मिली।";
                return;
            }

            const appUrl =
                "globeface://reel?reelId=" +
                encodeURIComponent(reelId);

            document.getElementById("status").innerText =
                "Opening Globeface...";

            window.location.href = appUrl;

            setTimeout(function () {
                document.getElementById("fallback").style.display = "block";
            }, 1800);
        };
    </script>
</head>

<body style="
    background:#121212;
    color:white;
    text-align:center;
    font-family:Arial,sans-serif;
    padding-top:100px;
">

    <h2>Globeface</h2>

    <p id="status">
        Opening reel...
    </p>

    <div id="fallback" style="display:none;">
        <p>App automatically open नहीं हुई?</p>

        <a
            href="https://play.google.com/store/apps/details?id=com.ags.globeface"
            style="
                display:inline-block;
                padding:14px 22px;
                border:1px solid #fff;
                border-radius:12px;
                color:white;
                text-decoration:none;
            "
        >
            Open Globeface
        </a>
    </div>

</body>
</html>
